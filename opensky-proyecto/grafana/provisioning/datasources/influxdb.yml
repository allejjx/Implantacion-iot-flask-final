apiVersion: 1
datasources:
  - name: OpenSky InfluxDB
    uid: opensky-influx
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: opensky
      defaultBucket: aviones
    secureJsonData:
      token: $INFLUX_TOKEN
